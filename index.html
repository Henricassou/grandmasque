<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Painel São Paulo Grand Masqué</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style id="gm-style">
/* Layout: cabeçalho + abas; aba Retroplanejamento = KPIs, filtro por fase e Gantt semanal com todos os dias */
:root{
  --bg:#f5f0e8; --surface:#fffdf9; --surface2:#ece6da; --line:#d8d0c1;
  --fg:#080808; --muted:#5c5c5c; --accent:#d2002d; --accent-fg:#ffffff; --accent-soft:#f7d9de;
  --gold:#b88e52; --gold-soft:#efe3cf; --wine:#460810;
  --done:#8a857d; --hol:#e4ddce;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080808; --surface:#131110; --surface2:#1d1a18; --line:#322d29;
  --fg:#f5f0e8; --muted:#a8a199; --accent:#ec2a50; --accent-fg:#ffffff; --accent-soft:#3a0c16;
  --gold:#c9a063; --gold-soft:#2d2417; --wine:#7a1624;
  --done:#6e6962; --hol:#24201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080808; --surface:#131110; --surface2:#1d1a18; --line:#322d29;
  --fg:#f5f0e8; --muted:#a8a199; --accent:#ec2a50; --accent-fg:#ffffff; --accent-soft:#3a0c16;
  --gold:#c9a063; --gold-soft:#2d2417; --wine:#7a1624;
  --done:#6e6962; --hol:#24201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header{padding-block:24px 8px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;justify-content:space-between}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.stamp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:12px}
nav button{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.page{padding-top:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi b.bad{color:var(--accent)}
.kpi i{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin-top:24px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;font-weight:500;background:none;border:0;color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline-offset:-2px}
.go{display:flex;gap:8px}
.go button{font:inherit;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.go button:hover{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 10px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:10px;border-radius:3px}
.sw.doing{background:var(--fg)} .sw.done{background:var(--done)} .sw.late{background:var(--accent)}
.sw.todo{border:1px dashed var(--muted);background:color-mix(in srgb,var(--fg) 8%,transparent)}
.sw.hol{width:12px;height:12px;background:repeating-linear-gradient(45deg,var(--hol),var(--hol) 3px,transparent 3px,transparent 6px);border:1px solid var(--line)}
.sw.car{width:12px;height:12px;background:var(--gold-soft);border:1px solid var(--gold)}
.dm{display:inline-block;width:10px;height:10px;transform:rotate(45deg);background:var(--gold);border-radius:1px}
.dm.ev{background:var(--accent)}
.ln{display:inline-block;width:2px;height:12px;background:var(--accent)}
.cardw{position:relative}
.gts{overflow:auto;max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px);min-height:320px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.gt{--dw:26px;--c1:310px;--c2:72px;--c3:58px;--L:calc(var(--c1) + var(--c2) + var(--c3));position:relative;width:max-content;min-width:100%;font-size:13px}
.r{display:grid;grid-template-columns:var(--c1) var(--c2) var(--c3) calc(var(--n)*var(--dw))}
.c{position:sticky;z-index:5;background:var(--surface);padding:0 10px;display:flex;align-items:center;min-width:0;border-bottom:1px solid var(--line)}
.c1{left:0}.c2{left:var(--c1);font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.c3{left:calc(var(--c1) + var(--c2));font-family:var(--f-mono);font-size:11.5px;color:var(--muted);border-right:1px solid var(--line)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.nm.m{font-weight:600}
.nm .dm{margin-right:9px;flex:none}
.row{height:38px}
.tl{position:relative;height:38px;border-bottom:1px solid var(--line);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--dw)*5),color-mix(in srgb,var(--fg) 5%,transparent) calc(var(--dw)*5) calc(var(--dw)*7)),repeating-linear-gradient(90deg,transparent 0 calc(var(--dw) - 1px),color-mix(in srgb,var(--fg) 7%,transparent) calc(var(--dw) - 1px) var(--dw))}
.band{grid-column:1/-1;height:30px;background:var(--surface2);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);display:flex;align-items:center}
.band span{position:sticky;left:12px;display:inline-flex;gap:10px;align-items:center}
.band em{font-style:normal;color:var(--muted);letter-spacing:0;text-transform:none}
.head{position:sticky;top:0;z-index:8;background:var(--surface)}
.head .c{background:var(--surface2);border-bottom:0;color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.head .r{border-bottom:1px solid var(--line)}
.hrow{display:flex;background:var(--surface)}
.hrow.w{height:26px}.hrow.l{height:20px}.hrow.n{height:24px;border-top:0}
.wk{flex:none;width:calc(var(--dw)*7);border-left:1px solid var(--line);font-family:var(--f-mono);font-size:11px;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;color:var(--fg);font-weight:500}
.wk.evw{background:var(--accent-soft)}
.d{flex:none;width:var(--dw);text-align:center;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;border-left:1px solid color-mix(in srgb,var(--fg) 7%,transparent)}
.hrow.n .d{font-size:11.5px;color:var(--fg)}
.d.we{background:var(--surface2)}
.d.hol{background:repeating-linear-gradient(45deg,var(--hol),var(--hol) 3px,transparent 3px,transparent 6px)}
.d.car{background:var(--gold-soft);color:var(--fg)}
.d.evt{background:var(--accent);color:var(--accent-fg);font-weight:600}
.d.hj span{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font-weight:600}
.ov{position:absolute;top:0;bottom:0;left:var(--L);width:calc(var(--n)*var(--dw));pointer-events:none}
.ov.a{z-index:1}.ov.b{z-index:4}
.ov i{position:absolute;top:0;bottom:0;width:var(--dw)}
.ov i.hol{background:repeating-linear-gradient(45deg,var(--hol),var(--hol) 3px,transparent 3px,transparent 6px);opacity:.8}
.ov i.car{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.ov i.evt{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ov u{position:absolute;top:0;bottom:0;width:2px;text-decoration:none;background:var(--fg)}
.ov u.ev{background:var(--accent)}
.bar{position:absolute;top:9px;height:20px;border-radius:5px;z-index:2;overflow:hidden;cursor:default}
.bar i{display:block;height:100%}
.bar.todo{background:color-mix(in srgb,var(--fg) 8%,transparent);border:1px dashed var(--muted)}
.bar.doing{background:color-mix(in srgb,var(--fg) 18%,transparent)} .bar.doing i{background:var(--fg)}
.bar.done{background:var(--done)} .bar.done i{background:var(--done)}
.bar.late{background:color-mix(in srgb,var(--accent) 22%,transparent)} .bar.late i{background:var(--accent)}
.ms{position:absolute;top:10px;width:18px;height:18px;z-index:2;transform:rotate(45deg);background:var(--gold);border-radius:2px;cursor:default;margin-left:-9px}
.ms.ev{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.ms.done{background:var(--done)}
.ms.late{background:var(--accent)}
.mt{position:absolute;top:0;height:38px;display:flex;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);z-index:2;white-space:nowrap;pointer-events:none}
.tip{position:absolute;z-index:30;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.4;max-width:300px;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tip b{display:block;font-weight:600;font-size:13px;margin-bottom:2px}
.tip span{display:block;font-family:var(--f-mono);font-size:11px;opacity:.8}
.tip p{margin:4px 0 0;opacity:.9}
.note{font-size:13px;color:var(--muted);margin:12px 0 0;max-width:80ch}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;max-width:760px}
.empty h2{font-family:var(--f-display);margin:0 0 6px;font-size:22px}
.empty p{margin:6px 0;color:var(--muted)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
@media(max-width:700px){
  .gt{--c1:158px;--L:var(--c1)}
  .r{grid-template-columns:var(--c1) calc(var(--n)*var(--dw))}
  .c2,.c3{display:none}
  .c1{border-right:1px solid var(--line);padding:0 8px;font-size:12px}
  .nm{white-space:normal;line-height:1.2;font-size:12px}
}
body{margin:0}
.hact{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:8px;position:relative}
.eye{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:500;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eye[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.eye:hover{border-color:var(--accent)}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:min(420px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.pop h3{font-family:var(--f-display);font-size:16px;margin:0 0 4px}
.pop p{margin:4px 0 10px;font-size:13px;color:var(--muted)}
.pop .lk{display:flex;gap:8px}
.pop input{flex:1;min-width:0;font:inherit;font-family:var(--f-mono);font-size:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.btn{font:inherit;font-size:13px;font-weight:500;background:var(--fg);color:var(--bg);border:1px solid var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.bad{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.5;cursor:default}
.btn:hover:not(:disabled){border-color:var(--accent)}
.pop .row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hint{font-size:13px;color:var(--muted);margin:14px 0 0;display:flex;gap:8px;align-items:center}
.hint .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.bar.ed,.ms.ed{cursor:grab}
.bar.ed:active,.ms.ed:active{cursor:grabbing}
.bar s{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;text-decoration:none;z-index:3}
.bar s.hl{left:0}.bar s.hr{right:0}
.bar.ed s:hover{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.bar.sel,.ms.sel{outline:2px solid var(--accent);outline-offset:2px}
.c1.ed{cursor:pointer}
.c1.ed:hover .nm{text-decoration:underline}
.panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h3{font-family:var(--f-display);font-size:18px;margin:0 0 12px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fg label{display:flex;flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.fg label.w2{grid-column:span 2}
.fg input,.fg select,.fg textarea{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.fg textarea{min-height:64px;resize:vertical}
.panel .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.panel .acts .sp{flex:1}
.savebar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;max-width:760px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.savebar b{font-weight:600}
.savebar .sp{flex:1;min-width:120px;font-size:13px}
.savebar .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.savebar .btn.sec{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.toast{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--fg);border:1px solid var(--accent)}
:root{--done:#2f8f5b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--done:#3fae74}}
:root[data-theme="dark"]{--done:#3fae74}
.gt{--c3:126px}
.c3{white-space:nowrap}
.bar.done i{background:var(--done)}

.mata{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:500;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--surface)}
.mata:hover{border-color:var(--accent)}
.stamp{display:flex;flex-direction:column;align-items:flex-start}
.mlist,.mtog{display:none}
@media(max-width:700px){
  .mlist{display:block;margin-top:12px}
  .mtog{display:block;width:100%;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit;font-size:13px}
  #app .cardw{display:none}
  #app.showg .cardw{display:block}
  #app.showg .mlist{display:none}
  .mlist h4{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .mc{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}

}

/* ---- Jornada do Público ---- */
.hyp{margin:16px 0 0;background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--fg);max-width:92ch}
.sw.g0{background:var(--gold)}.sw.g1{background:var(--fg)}.sw.g2{background:var(--wine)}.sw.g3{background:var(--accent)}
.jcard{position:relative}
.gt.jn{--dw:30px;--c1:240px;--L:var(--c1)}
.jn .r{grid-template-columns:var(--c1) calc(var(--n)*var(--dw))}

  background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--dw)*4 - 1px),color-mix(in srgb,var(--fg) 20%,transparent) calc(var(--dw)*4 - 1px) calc(var(--dw)*4)),repeating-linear-gradient(90deg,transparent 0 calc(var(--dw) - 1px),color-mix(in srgb,var(--fg) 7%,transparent) calc(var(--dw) - 1px) var(--dw))}

var tt=new Date(), HOJE=Date.UTC(tt.getFullYear(),tt.getMonth(),tt.getDate()), EV=u(EVENTO);

function calc(){
  ROWS=TAREFAS.map(function(r){
    var ini=u(r.inicio),fim=u(r.fim),sit;
    if(r.status===C)sit="done";
    else if(fim<HOJE)sit="late";
    else if(r.status===A)sit="doing";
    else if(ini<HOJE)sit="late";
    else sit="todo";
    var dd=Math.round((EV-fim)/DAY);
    return Object.assign({},r,{ini:ini,fim:fim,sit:sit,dl:dd===0?"D":dd>0?"D-"+dd:"D+"+(-dd),per:periodo(ini,fim)});
  });
  FASES=[];TAREFAS.forEach(function(r){if(FASES.indexOf(r.fase)<0)FASES.push(r.fase)});
}
function normaliza(){
  var ordem=[];TAREFAS.forEach(function(r){if(ordem.indexOf(r.fase)<0)ordem.push(r.fase)});
  var idx=TAREFAS.map(function(r,i){return {r:r,i:i}});
  idx.sort(function(a,b){return ordem.indexOf(a.r.fase)-ordem.indexOf(b.r.fase)||a.i-b.i});
  TAREFAS=idx.map(function(x){return x.r});
}
function byId(id){return TAREFAS.find(function(t){return t.id===id})}

function kpis(){
  var tarefas=ROWS.filter(function(r){return r.tipo!=="marco"});
  var avg=tarefas.length?Math.round(tarefas.reduce(function(t,r){return t+(r.sit==="done"?100:+r.avanco||0)},0)/tarefas.length):0;
  var conc=tarefas.filter(function(r){return r.sit==="done"}).length;
  var and=tarefas.filter(function(r){return r.sit==="doing"}).length;
  var atr=tarefas.filter(function(r){return r.sit==="late"}).length;
  var prox=ROWS.filter(function(r){return r.tipo==="marco"&&r.sit!=="done"&&r.fim>=HOJE}).sort(function(a,b){return a.fim-b.fim})[0];
  var h='<div class="kpis">';
  h+='<div class="kpi"><span>Avanço geral</span><b>'+avg+'%</b><i>'+conc+' de '+tarefas.length+' entregas concluídas</i></div>';
  h+='<div class="kpi"><span>Em andamento</span><b>'+and+'</b><i>entregas com trabalho aberto</i></div>';
  h+='<div class="kpi"><span>Atrasadas</span><b'+(atr?' class="bad"':'')+'>'+atr+'</b><i>'+(atr?'barras em vermelho no cronograma':'nenhuma entrega fora do prazo')+'</i></div>';
  if(prox)h+='<div class="kpi"><span>Próximo marco</span><b style="font-size:20px;line-height:1.25;margin-top:8px">'+esc(prox.tarefa)+'</b><i>'+fd(prox.fim)+' · '+prox.dl+' · '+esc(prox.responsavel)+'</i></div>';
  return h+'</div>';
}

document.addEventListener("pointermove",function(e){
  if(!drag)return;

  if(drag.j){
    var dq=Math.round(dx/JW)*15,jni=drag.i0,jnf=drag.f0,span=drag.f0-drag.i0;
    if(drag.mode==="mov"){jni=drag.i0+dq;jnf=drag.f0+dq;if(jni<JS0){jni=JS0;jnf=jni+span}if(jnf>JE0){jnf=JE0;jni=jnf-span}}
    else if(drag.mode==="ini"){jni=Math.max(JS0,Math.min(drag.i0+dq,drag.f0-15))}
    else{jnf=Math.min(JE0,Math.max(drag.f0+dq,drag.i0+15))}
    drag.ni=jni;drag.nf=jnf;
    var jxp=(jni-JS0)/15*JW;

    return;
  }
  var dd=Math.round(dx/DW),ni=drag.i0,nf=drag.f0;

  else if(drag.mode==="ini"){ni=Math.min(drag.i0+dd*DAY,drag.f0)}
  else{nf=Math.max(drag.f0+dd*DAY,drag.i0)}
  drag.ni=ni;drag.nf=nf;

function agora(){var d=new Date(),p=function(n){return String(n).padStart(2,"0")};return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
function salvarPublicar(){
  if(!API||salvando)return;
  salvando=true;render();
  var oldM=JSON.stringify(META);
  META.versao=(META.versao||1)+1;META.atualizado=agora();
  var html=SK_HEAD+"\n"+conteudo()+"\n</body></html>";
  API.publish(html).then(function(){
    /* a página recarrega na versão nova */
  },function(err){
    META=JSON.parse(oldM);salvando=false;
    var c=err&&err.code;
    msg=c==="conflict"?"Outra pessoa publicou uma versão nova antes de você. Recarregue a página e refaça as alterações.":c==="not_writer"||c==="not_granted"?"Seu acesso não permite editar este painel.":c==="too_large"?"O painel ficou grande demais para publicar.":"Não foi possível publicar agora. Suas alterações continuam na tela; tente de novo.";
    render();
  });
}

  var t=byId(estado.sel);if(!t)return;
  var g=function(id){return document.getElementById(id)};

  if(tipo==="marco")fim=ini;
  if(u(fim)<u(ini)){var x=ini;ini=fim;fim=x}
  var st=g("f-st").value,av=Math.max(0,Math.min(100,parseInt(g("f-av").value,10)||0));
  if(st===C)av=100;
  t.tarefa=tarefa;t.fase=fase;t.responsavel=g("f-resp").value.trim();t.tipo=tipo;t.inicio=ini;t.fim=fim;t.status=st;t.avanco=av;t.nota=g("f-nota").value.trim();

}
